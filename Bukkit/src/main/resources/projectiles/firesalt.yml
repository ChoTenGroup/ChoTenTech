small_firesalt:
  fuse: 2.0~3.0
  impact: false
  sounds:
    throw: { sound: minecraft:entity.snowball.throw, volume: 1.0, pitch: 0.8 }
    bounce: { sound: minecraft:entity.item.break, volume: 0.5, pitch: 0.5 }
    fuse: { sound: minecraft:block.fire.ambient, volume: 0.8, pitch: 1.8 }
  particles:
    throw: { particle: flame, count: 16, speed: 0.2 }
    bounce: { particle: smoke, count: 8, speed: 0.15 }
    fuse: { particle: small_flame, count: 6, offset_x: 0.3, offset_y: 0.3, offset_z: 0.3, speed: 0.08 }
    trail: { particle: small_flame, count: 1, speed: 0.05 }
    cook: { particle: flame, count: 10, speed: 0.25 }
  bounce:
    max: 2
    factor: 0.5
    upward: 0.1
  effects:
    - type: fireburst
      range: 4
      amount: 6
      damage:
        burn: 6
      sound: { sound: minecraft:entity.firework_rocket.blast, volume: 3.0, pitch: 0.7 }
      particle: { particle: flame, count: 40, speed: 0.5 }
      shockwave: { particle: flame, count: 30, speed: 1.2, rings: 3 }

big_firesalt:
  fuse: 3.0~4.5
  impact: false
  sounds:
    throw: { sound: minecraft:entity.snowball.throw, volume: 1.0, pitch: 0.6 }
    bounce: { sound: minecraft:entity.item.break, volume: 0.4, pitch: 0.4 }
    fuse: { sound: minecraft:block.fire.ambient, volume: 1.2, pitch: 1.2 }
  particles:
    throw: { particle: flame, count: 24, speed: 0.3 }
    bounce: { particle: large_smoke, count: 10, speed: 0.2 }
    fuse: { particle: flame, count: 10, offset_x: 0.4, offset_y: 0.4, offset_z: 0.4, speed: 0.1 }
    trail: { particle: flame, count: 2, speed: 0.06 }
    cook: { particle: flame, count: 18, speed: 0.35 }
  bounce:
    max: 1
    factor: 0.3
    upward: 0.05
  effects:
    - type: fireburst
      range: 8
      amount: 12
      damage:
        burn: 20
      sound: { sound: minecraft:entity.firework_rocket.large_blast, volume: 5.0, pitch: 0.4 }
      particle: { particle: flame, count: 80, speed: 0.7 }
      shockwave: { particle: flame, count: 48, speed: 1.5, rings: 5 }
