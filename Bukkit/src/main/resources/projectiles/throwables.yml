nizxc_flash:
  fuse: 2.0~3.0
  impact: false
  bounce:
    max: 3
    factor: 0.5
    upward: 0.15
  sounds:
    throw: { sound: minecraft:entity.arrow.shoot, volume: 1.2, pitch: 0.6 }
    bounce: { sound: minecraft:entity.item.break, volume: 0.5, pitch: 1.5 }
    fuse: { sound: minecraft:entity.creeper.primed, volume: 1.2, pitch: 1.8 }
  particles:
    throw: { particle: cloud, count: 24, speed: 0.35 }
    bounce: { particle: smoke, count: 12, speed: 0.2 }
    fuse: { particle: electric_spark, count: 10, offset_x: 0.3, offset_y: 0.3, offset_z: 0.3, speed: 0.18 }
    trail: { particle: glow, count: 1, speed: 0.08 }
    cook: { particle: smoke, count: 20, speed: 0.35 }
  effects:
    - type: blindness
      range: 5
      seconds: 14
      sound: { sound: minecraft:entity.firework_rocket.large_blast, volume: 6.0, pitch: 0.3 }
      particle: { particle: flash, count: 1 }
      shockwave: { particle: glow, count: 80, speed: 2.0, rings: 5 }
    - type: blindness
      range: 12
      seconds: 6
      particle: { particle: explosion, count: 40, speed: 1.0 }
    - type: blindness
      range: 18
      seconds: 3
      particle: { particle: explosion, count: 25, speed: 0.6 }
    - type: potion
      effect: NAUSEA
      seconds: 10
      range: 12
      particle: { particle: ring, count: 1 }
    - type: potion
      effect: BLINDNESS
      seconds: 6
      range: 8
      particle: { particle: large_smoke, count: 120, offset_x: 1.5, offset_y: 0.8, offset_z: 1.5, speed: 0.15 }
    - type: potion
      effect: SLOWNESS
      seconds: 5
      range: 14
      level: 2
      particle: { particle: vibration, count: 8 }

