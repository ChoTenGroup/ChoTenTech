lightningbottle_humanmade:
  fuse: 2.0~3.0
  impact: false
  sounds:
    throw: { sound: minecraft:entity.snowball.throw, volume: 1.0, pitch: 1.2 }
    bounce: { sound: minecraft:entity.item.break, volume: 0.5, pitch: 1.8 }
    fuse: { sound: minecraft:block.fire.ambient, volume: 0.8, pitch: 1.5 }
  particles:
    throw: { particle: electric_spark, count: 12, speed: 0.2 }
    bounce: { particle: smoke, count: 6, speed: 0.1 }
    fuse: { particle: electric_spark, count: 4, offset_x: 0.2, offset_y: 0.2, offset_z: 0.2, speed: 0.05 }
  bounce:
    max: 2
    factor: 0.5
    upward: 0.1
  effects:
    - type: lightning_strike
      range: 10
      amount: 3
      power: 3
      damage:
        shock: 8
        burn: 4
      sound: { sound: minecraft:entity.lightning_bolt.thunder, volume: 3.0, pitch: 0.8 }
      particle: { particle: electric_spark, count: 30, speed: 0.5 }
      shockwave: { particle: electric_spark, count: 24, speed: 1.0, rings: 3 }

