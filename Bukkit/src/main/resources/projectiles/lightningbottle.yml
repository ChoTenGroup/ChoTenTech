  particles:
    throw: { particle: electric_spark, count: 18, speed: 0.3 }
    bounce: { particle: smoke, count: 8, speed: 0.15 }
    fuse: { particle: electric_spark, count: 6, offset_x: 0.3, offset_y: 0.3, offset_z: 0.3, speed: 0.08 }
  bounce:
    max: 1
    factor: 0.4
    upward: 0.1
  effects:
    - type: lightning_strike
