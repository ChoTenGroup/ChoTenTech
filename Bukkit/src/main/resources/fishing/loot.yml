# ============================================================================
# 钓鱼战利品表
# key = 所需最低钓鱼等级
# items 内的物品使用 Sertraline 物品 ID 或 MINECRAFT_<Material> 表示原版物品
# weight = 权重（越高概率越大）
# xp = 钓到该物品获得的经验范围
# amount = 数量范围
# ============================================================================

