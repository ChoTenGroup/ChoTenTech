checks:
  gamemode:
    misc:
      - creative
      # - spectator 暂时不写因为考虑到有些情况可能用旁观
  opcheck:
    misc:
      - op
  allperm:
    permissions:
      - *
      - luckperms.autoop
  kether:
    commands:
      - (chemdahscript|chs).+
      - (ady|adyeshach) script.+
      - adyeshachscript.+
      - (trm|trmenu) action.+
      - invero dev.+
      - idev.+
      - .+command (papi )?["'].+
  worldedit:
    commands:
      - /(cut|set)
  generalcommands:
    commands:
      # 配置前带_标识宽松检查
      - _tp.+
      - _gamemode.+
  setpresidentcheck:
    commands:
      - (lp|luckperms|perm|permission|permissions|perms|luckpermsbungee|lpb|luckpermsvelocity|lpv) user .+ parent .+ president.+
  setcorecheck:
    commands:
      - (lp|luckperms|perm|permission|permissions|perms|luckpermsbungee|lpb|luckpermsvelocity|lpv) user .+ parent .+ core.+
      - op .+
  setindependentcheck:
    commands:
      - (lp|luckperms|perm|permission|permissions|perms|luckpermsbungee|lpb|luckpermsvelocity|lpv) user .+ parent .+ independent.+
  setadmincheck:
    commands:
      - (lp|luckperms|perm|permission|permissions|perms|luckpermsbungee|lpb|luckpermsvelocity|lpv) user .+ parent .+ enterprise.+
      - (lp|luckperms|perm|permission|permissions|perms|luckpermsbungee|lpb|luckpermsvelocity|lpv) user .+ parent .+ observer.+
  sethelpercheck:
      - (lp|luckperms|perm|permission|permissions|perms|luckpermsbungee|lpb|luckpermsvelocity|lpv) user .+ parent .+ helper.+
      - (lp|luckperms|perm|permission|permissions|perms|luckpermsbungee|lpb|luckpermsvelocity|lpv) user .+ parent .+ moderator.+