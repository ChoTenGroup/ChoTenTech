# =====================================================================
#  ChoTenTech — 枪械机制配置（P3：手感与磨损闭环）
#  独立于 config.yml（config.yml 为 GBK 编码，请勿在此文件以外改它）
#  所有键名固定为英文小写 + 连字符；修改后执行 /ctt reload 生效。
# =====================================================================

# ---------------------------------------------------------------------
# 散布（单位：度）
#   spreadBase = (100 - 枪械 accuracy) * k / 100
#   barrelMult = 1 - min(0.25, barrelLength * barrel-per-meter)
#   durabilitySpread = 1 + (1 - 耐久比) * 0.6        （耐久见底 ×1.6）
#   burstSpread      = min(1.5, 1 + 已打出的发数 * 0.03)
#   最终散布   = spreadBase * barrelMult * durabilitySpread * burstSpread
#                * 情境系数之积 * 热量档位系数 * ADS 系数
# ---------------------------------------------------------------------
spread:
  k: 8.0                  # 精度为 0 时的基础散布度数（精度 100 时为 0）
  barrel-per-meter: 0.05  # 每米枪管减少的散布比例（最多减 25%）
  moving: 1.5             # 移动中散布倍率
  air: 2.0                # 滞空散布倍率
  sneaking: 0.75          # 潜行散布倍率
  hurt: 1.3               # 刚受伤时的散布倍率
  ads: 0.5                # 瞄准（ADS）状态下的散布倍率（受 scope.enabled 控制）

# ---------------------------------------------------------------------
# 后坐（视角抬升量，单位：度 / 度每 tick）
#   每发：recoilVelP += recoilV * samplePattern(recoilPattern, n) * (ammo.recoil/100)
#                      * speed * 0.1 * (ADS?0.7:1) * (1 + (1-耐久比)*0.3)
#   每 tick：velP *= (1 - damping); pitch += velP; pitch *= (1 - recovery)
#
#   曲线写在**枪械 YAML**（`gun:` 段下，与 attributes 同级），键 = 第几发：
#       gun:
#         recoil:            # 垂直后坐系数（键从第 1 发开始）
#           1: 1
#           5: 5
#           10: 2
#         shake:             # 水平抖动系数（键从第 0 发开始，正=右 负=左）
#           0: 0
#           5: -2.2
#           10: 2.2
#   采样规则：落在两键之间**线性插值**；小于首键取首键；大于末键取末键。
#   连发序号（第几发）在停火 reset-seconds 后归零重新计数，
#   但实际窗口至少是「两倍射速间隔」，否则射速慢的枪每发都会被算成第 1 发，曲线只会用到第一帧。
# ---------------------------------------------------------------------
recoil:
  speed: 0.35             # 后坐冲量系数（把 recoilV 换算成每 tick 视角偏移）
  damping: 0.12           # 后坐速度阻尼（越大衰减越快）
  recovery: 0.02          # 腰射时的回中速度
  recovery-ads: 0.04      # 瞄准时的回中速度（更稳）
  recovery-delay: 0.12    # P3：最后一发之后延迟多久才开始回中（秒）；延迟内只衰减速度
  max-accumulation: 12.0  # 单次连射可累积的最大后坐度数
  reset-seconds: 0.35     # 停火多久后射击序号归零（实际取它与「两倍射速间隔」的较大值）

# ---------------------------------------------------------------------
# 瞄准（按住右键）
#   zoom 通过改写服务端 Abilities 包的 fovModifier 实现，与移速完全解耦
#   单把枪可用 `gun.usage.zoom` 覆盖全局 zoom
# ---------------------------------------------------------------------
scope:
  enabled: true           # true = ADS 时套用 spread.ads 的散布收窄 + FOV 缩放
  zoom: 2.5               # 默认缩放倍数（1.0 = 不放大）；2.5 ≈ 视野压缩到 40%
  move-multiplier: 0.55   # 瞄准时的移速系数（1.0 = 不减速），以移动速度属性乘法修饰符实现

# 热成像（ADS + 配件 thermal: true 时生效，允许穿墙发光）
thermal:
  enabled: true
  radius: 8.0             # 准星射线落点周围的扫描半径
  interval-ticks: 5       # 扫描间隔
  glow-ticks: 40          # 每次点亮的持续时间

# ---------------------------------------------------------------------
# 物品名称上的耐久（nameplate）
#   把耐久写进枪械物品的显示名，形如：OFN-12手枪 [873/1000]
#   基础名来自 Sertraline 的 itemdef.name，本段只负责后缀
#   占位符：{name} {cur} {max} {percent} {bar} {color} {end} {flag}
#     {flag} = 损坏 / 严重故障 / 卡壳 的状态标记，正常时为空
# ---------------------------------------------------------------------
nameplate:
  enabled: true
  format: "{name} <#6E7A8C>[</#6E7A8C>{color}{cur}{end}<#6E7A8C>/</#6E7A8C>{max}<#6E7A8C>]</#6E7A8C>{flag}"
  hide-when-full: false   # true = 满耐久时不显示 [1000/1000]
  colors:
    good: "#8FD4A6"       # 耐久 >= 50%
    warn: "#EFDF8F"       # 耐久 >= 20%
    bad: "#E08A98"        # 耐久 < 20% 或已损坏
  bar-length: 10          # {bar} 的格数（不想用进度条可把它从 format 里去掉）

# ---------------------------------------------------------------------
# 弹道（纯服务端模拟，速度单位：格 / tick = bulletSpeed / 20）
#   弹速额外乘耐久系数：0.85 + 0.15 * 耐久比（耐久 50% 以上几乎无感）
# ---------------------------------------------------------------------
ballistics:
  gravity: 0.05           # 每 tick 下坠
  drag: 0.99              # 每 tick 速度衰减
  sub-step: 0.5           # 每子步最大位移（格），越小越不易穿模
  max-sub-steps: 8        # 单 tick 最多子步数（防止低弹速高射速时 CPU 爆炸）
  max-bullets: 400        # 全服同时存在的子弹上限
  max-range-multiplier: 3.0  # 飞行距离超过 range * 该倍率即回收

# ---------------------------------------------------------------------
# 穿透（方块）
#   penetration.thin 以下的厚度算“薄墙”，可以打穿
# ---------------------------------------------------------------------
penetration:
  thin: 0.12              # 薄墙厚度阈值（格）
  hardness-limit: 3.0     # 只有硬度不超过该值的薄方块才允许穿透
  speed-loss: 0.25        # 每穿透一层损失的速度比例
  damage-loss: 0.15       # 每穿透一层损失的伤害比例

# ---------------------------------------------------------------------
# 过热（P3：四档闭环）
#   档位：0 安全 / 1 轻微 / 2 过热 / 3 严重
#   射速：shotInterval = round(1200 / (fireRate * rate-mult[档位]))
#   严重档：进入时强制停火 severe-stop-ms 毫秒（"强制停火" 提示 + 冒烟）
#   触顶：heat >= capacity 时锁定扳机，降到 capacity * unlock-ratio 以下才解锁
# ---------------------------------------------------------------------
heat:
  capacity: 100.0         # 热量上限（缺省值，枪械可单独配置）
  per-shot: 5.0           # 每发增加（缺省值）
  cool-per-tick: 0.06     # 每 tick 冷却（缺省值）
  tier-mild: 40.0         # 温热档起点
  tier-hot: 60.0          # 过热档起点
  tier-severe: 80.0       # 严重档起点（进入即强制停火）
  severe-stop-ms: 2000    # 严重档强制停火时长（毫秒，与 forcedStopUntil 同单位）
  unlock-ratio: 0.6       # 触顶后需冷却到 capacity * 该比例以下才解锁（0.6 = 60%）
  rate-mult: [1.0, 0.95, 0.85, 0.7]   # 四档射速系数（安全 / 轻微 / 过热 / 严重）
  # 上面 rate-mult 若写成标量风格，也可改用下面三个键（列表缺失时才读）：
  # rate-mild: 0.95
  # rate-hot: 0.85
  # rate-severe: 0.7

# ---------------------------------------------------------------------
# 耐久磨损（P3）
#   每发扣除：per-shot * (1 + 子弹穿甲值 / 100 * 0.5)，最低扣到 0
#   耐久归零后枪械只能近战（见 broken-melee）
# ---------------------------------------------------------------------
wear:
  per-shot: 0.06          # 每次开火扣除的耐久（默认弹匣打空约掉 0.5 点）

# ---------------------------------------------------------------------
# 手部体力
#   消耗：出枪 draw-cost / 瞄准每秒 hold-cost-per-second × ads-multiplier / 每次开火 shot-cost
#   恢复：**最后一次消耗之后**静默 regen-delay-seconds（默认 5 秒），
#         之后每秒回复「上限的 regen-percent-per-second」（默认 5%）
#         上限由属性 hand_stamina_max 决定，回复速度再乘属性 hand_stamina_regen_multiplier（1.0 = 100%）
# ---------------------------------------------------------------------
stamina:
  draw-cost: 8.0              # 出枪消耗（切到枪械到能操作之间扣）
  hold-cost-per-second: 2.0   # 持续瞄准每秒消耗
  shot-cost: 1.2              # 每次开火消耗
  ads-multiplier: 1.5         # 瞄准状态下的消耗倍率
  regen-delay-seconds: 5.0    # 最后一次消耗后要等多久才开始回复（秒）
  regen-percent-per-second: 5.0   # 每秒回复「手部体力上限」的百分比
  regen-pause-when-armed: true    # 手持枪械时是否套用下面的「持枪恢复速度」
  regen-armed-percent-per-second: 0.0  # 持枪时每秒回复的百分比；0 = 拿着枪回不动

# ---------------------------------------------------------------------
# 枪械损坏后的近战（P3 起生效：耐久归零 = 纯近战钝器）
#   固定伤害，不吃 attack_damage / 暴击 / 增伤，但仍走通用物理减免
# ---------------------------------------------------------------------
broken-melee:
  damage: 3.0             # 固定伤害
  cooldown-ticks: 20      # 近战冷却（20 tick = 1 秒）
  range: 3.0              # 可击打距离（格），取视线锥内最近的目标

# ---------------------------------------------------------------------
# 音效（Bukkit SoundKey 字符串）
# ---------------------------------------------------------------------
sounds:
  fire: "item.crossbow.shoot"
  # 空膛 / 无弹时扳机落空的「咔哒」声。
  # 这里曾经写的是 item.crossbow.dry_fire —— 该音效在 Minecraft 里**不存在**
  # （26.2 的弩音效只有 hit / loading_start|middle|end / quick_charge_1|2|3 / shoot），
  # 结果是控制台刷「Unable to play unknown soundEvent」且空膛完全没声音。
  empty: "block.lever.click"
  hit: "entity.arrow.hit"
  hit-block: "entity.arrow.hit_player"

# ---------------------------------------------------------------------
# 伤害（P1 追加：命中击退强度）
# ---------------------------------------------------------------------
damage:
  knockback: 0.08         # 命中时沿弹道方向施加的水平冲量

# ---------------------------------------------------------------------
# 护甲（P5：子弹 × 护甲）
# true：护甲减伤替代 DamageManager 的属性防御，避免 defense 被扣两次；
# false：保留旧属性防御链，护甲只磨损、不再额外减伤。
# ---------------------------------------------------------------------
armor:
  replaces-attribute-defense: true
  materials:
    DIAMOND:
      durability-mult: 0.6
      repair-material: DIAMOND
      level-bonus: 5.0
    IRON:
      durability-mult: 1.0
      repair-material: IRON_INGOT
      level-bonus: 0.0
    STEEL:
      durability-mult: 0.85
      repair-material: IRON_INGOT
      level-bonus: 2.0
    LEATHER:
      durability-mult: 1.4
      repair-material: LEATHER
      level-bonus: -5.0

# ---------------------------------------------------------------------
# 弹匣与读条动作（P2 追加）
#   换弹 / 卸弹匣 / 检视 / 压弹 / 退弹 全部走「读条动作」：
#   读条期间**水平**移动超过 interrupt-distance 格、切换主手槽位、死亡、
#   打开其它 GUI 都会中断且不结算（原地跳跃 / 上下台阶不算移动）。
#   起读条后的前 5 tick 不判 GUI，「点菜单按钮 → 关界面 → 起读条」这一拍
#   不会被旧界面误杀；关菜单也不会掐掉同一 tick 刚起的读条。
#   被打断时提示会写明原因（移动过远 / 切换了主手槽位 / 打开了其它界面……）。
#   枪械损坏（耐久 0）时换弹会被拒绝，但「排障」不受此限制。
# ---------------------------------------------------------------------
magazine:
  pickup-lock-ticks: 100  # 快速换弹丢出的弹匣多少 tick 内任何人都不许拾取（100 tick = 5 秒）
  interrupt-distance: 2.0 # 读条动作允许的最大**水平**位移（格），超过即中断；0 = 不因移动中断
  # 注意：`repair-materials` 已下线 —— 「排障」不再消耗任何材料，材料表也不再被代码读取。
  # 旧配置里留着这一节不会报错，但也不会生效（启动时若发现未读键会打一条 devLog）。
