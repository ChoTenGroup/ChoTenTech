# ============================================================================
# 副等级经验值配置 (Skill XP Configuration)
# 格式: <经验范围最小值>-<经验范围最大值>
# 实际获得的经验在范围内随机浮动
# ============================================================================

# === 采矿 (Mining) — 破坏方块 ===
mining:
  # 经验值 = 基础值 * (1 + 工具等级 * 0.1)
  break:
    STONE: 4-12
    COBBLESTONE: 4-8
    GRANITE: 4-12
    DIORITE: 4-12
    ANDESITE: 4-12
    TUFF: 4-12
    DEEPSLATE: 4-12
    GRAVEL: 4-8
    SAND: 4-8
    CLAY: 8-16
    COAL_ORE: 20-40
    DEEPSLATE_COAL_ORE: 24-48
    RAW_IRON: 20-32
    RAW_COPPER: 16-28
    COPPER_ORE: 20-32
    DEEPSLATE_COPPER_ORE: 20-36
    IRON_ORE: 32-60
    DEEPSLATE_IRON_ORE: 40-72
    LAPIS_ORE: 48-80
    DEEPSLATE_LAPIS_ORE: 60-100
    REDSTONE_ORE: 32-60
    DEEPSLATE_REDSTONE_ORE: 40-72
    GOLD_ORE: 40-80
    DEEPSLATE_GOLD_ORE: 48-88
    NETHER_GOLD_ORE: 32-60
    NETHER_QUARTZ_ORE: 20-40
    DIAMOND_ORE: 100-200
    DEEPSLATE_DIAMOND_ORE: 120-220
    EMERALD_ORE: 120-240
    DEEPSLATE_EMERALD_ORE: 140-260
    ANCIENT_DEBRIS: 200-400
    NETHERRACK: 4-8
    END_STONE: 4-8
    OBSIDIAN: 40-80
    CRYING_OBSIDIAN: 60-100
    GLOWSTONE: 12-24

# === 战斗 (Combat) — 击杀生物 ===
combat:
  kill:
    ZOMBIE: 12-32
    HUSK: 16-36
    DROWNED: 16-36
    SKELETON: 12-32
    WITHER_SKELETON: 32-60
    STRAY: 20-40
    CREEPER: 20-48
    SPIDER: 16-40
    CAVE_SPIDER: 20-48
    ENDERMAN: 40-80
    BLAZE: 32-60
    WITHER: 400-800
    ENDER_DRAGON: 800-1200
    WITCH: 32-60
    PHANTOM: 24-48
    SLIME: 8-24
    MAGMA_CUBE: 12-32
    PIGLIN: 20-48
    PIGLIN_BRUTE: 40-72
    HOGLIN: 32-60
    ZOGLIN: 40-72
    PILLAGER: 20-40
    VINDICATOR: 32-56
    EVOKER: 48-80
    RAVAGER: 80-140
    WARDEN: 600-1000
    ZOMBIFIED_PIGLIN: 16-32
    MAGMA_CUBE: 12-32
    GUARDIAN: 24-48
    ELDER_GUARDIAN: 120-240
    SHULKER: 32-60
    VEX: 12-24
    PLAYER: 80-200
    # 可在此添加其他生物类型

# === 力量 (Strength) — 近战伤害 ===
strength:
  # 每造成 1 点伤害（半颗心）获得的经验
  damage_multiplier: 1.0
  # 单次攻击最大经验
  max_per_hit: 50.0

# === 耐力 (Endurance) — 承受伤害 + 奔跑 ===
endurance:
  # 每承受 1 点伤害获得的经验
  damage_taken_multiplier: 4.0
  # 单次承受伤害最大经验
  max_per_event: 200.0
  # 每 tick 奔跑获得的经验（约 20 tick/秒）
  sprint_exp_per_tick: 0.8
  # 每 tick 游泳获得的经验
  swim_exp_per_tick: 1.2

# === 健康 (Health) — 治疗 ===
health:
  # 每恢复 1 点生命值获得的经验
  heal_multiplier: 8.0
  # 单次治疗事件最大经验
  max_per_event: 40.0

# === 智力 (Intelligence) — 附魔/酿造/合成 ===
intelligence:
  enchant: 40-120
  craft: 20-60
  smelt: 8-20
  brew: 32-80
  anvil: 20-60
  grindstone: 12-32

# === 敏捷 (Agility) — 跳跃/移动 ===
agility:
  # 每 tick 潜行/行走获得的经验
  move_exp_per_tick: 0.16
  # 跳跃经验
  jump_exp: 1.6
  # 每格坠落距离获得的经验（安全落地）
  safe_fall_exp_per_block: 3.2

# === 投掷 (Throwing) — 投掷物命中 ===
throwing:
  trident_hit: 20-60
  snowball_hit: 4-12
  egg_hit: 4-12
  splash_potion_hit: 12-32
  lingering_potion_hit: 20-40
  experience_bottle: 8-20
  firework: 8-24
  fishing_rod: 4-16

# === 理疗 (Physiotherapy) — 使用医疗物品 ===
physiotherapy:
  bandage_use: 20-40
  sterile_bandage_use: 32-48
  medkit_use: 40-100
  splint_use: 32-60
  pill_use: 12-32
  surgical_use: 60-120
  heal_other_multiplier: 1.5

# === 开锁 (Lockpicking) — 成功开锁 ===
lockpicking:
  unlock_success: 60-120
  unlock_fail: 8-20

# === 耕种 (Farming) — 占位，暂无效果 ===
farming:
  harvest: 8-20

# === 钓鱼 (Fishing) — 钓鱼获得经验 ===
fishing:
  # 钓到鱼
  caught_fish: 20-60
  # 钓到实体（如物品展示框、其他玩家等）
  caught_entity: 12-40

# === 烹饪 (Cooking) — 占位，暂无效果 ===
cooking:
  cook: 12-32

# === 伐木 (Woodcutting) — 占位，暂无效果 ===
woodcutting:
  chop: 8-24
