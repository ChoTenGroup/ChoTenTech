# chotentech Configuration
debug: false

# 语言 language (quetiapine)
lang: zh_CN

id:
  range:
    min: 100000000
    max: 9999999999

database:
  enable: false  # true: MySQL; false: SQLite
  filename: data # data.db for SQLite Database File.
  host: localhost
  port: 3306
  user: x_angelkawaii_x
  password: angelkawaii2
  database: chotentech
  table: chotentech_data

default:
  sanity: 40.0
  max-sanity: 100.0
  darkness: 15.0
  max-darkness: 100.0
  stamina: 100.0
  max-stamina: 100.0
  hand-stamina: 100.0
  max-hand-stamina: 100.0
  custom-hunger: 100.0
  max-custom-hunger: 100.0
  custom-saturation: 100.0
  max-custom-saturation: 100.0
  external-injury: 100.0
  max-external-injury: 100.0
  internal-injury: 100.0
  max-internal-injury: 100.0
  external-injury-regen: 0
  internal-injury-regen: 0
  sanity-regen: 0.0
  nutrition-grain: 50.0
  nutrition-vitamin: 50.0
  nutrition-protein: 50.0
  nutrition-fat: 50.0

warehouse:
  # 玩家默认仓库格数
  default-slots: 36
  # GUI 标题
  title: "个人仓库"
  # 权限扩容上限
  max-total-slots: 54
  # 仓库扩容配置（default=全局生效, 基地缩写=基地专属）
  expansions:
    default:
      vip:
        permission: "chotentech.warehouse.vip"
        slots: 9
      vip-plus:
        permission: "chotentech.warehouse.vip-plus"
        slots: 18
    # 基地专属扩容示例 (与全局叠加)
    #ALP:
    #  alphaextra:
    #    permission: "chotentech.warehouse.alphaextra"
    #    slots: 9
  # 基地独立仓库配置（覆盖全局设置）
  base:
    ALP:
      default-slots: 36
      title: "Alpha基地仓库"
      max-total-slots: 63

# 安全箱配置（塔科夫式，死亡不掉落）
secure-container:
  # 格子数量
  slots: 9
  # GUI 标题
  title: "安全箱"

# 投保系统配置
insurance:
  # 投保有效期（天）
  expire-days: 7
  # 投保菜单标题
  insurance-title: "物品投保"
  # 取回菜单标题
  cover-title: "取回物品"
  # 各 tier 投保价格（读取 ItemTag sertraline_tier）
  tiers:
    E: 100
    D: 100
    C: 200
    B: 600
    A: 2000
    S: 5000
    P: 10000
    PP: 50000
    PPP: 100000

# 压力系统配置
stress:
  # 检测间隔（tick，20tick = 1秒）
  interval: 40
  # 完全黑暗（亮度0）时每秒增加的压力
  max-stress-gain: 2.0
  # 最亮（亮度15）时每秒减少的压力
  max-stress-reduce: 1.0
  # 在基地中每秒减少的压力
  base-stress-reduce: 2.0
  # 压力超过此值开始掉精神
  sanity-drain-threshold: 80.0
  # 压力过高时每次掉精神值
  sanity-drain-amount: 0.2
  # 极度黑暗（亮度≤3）额外掉精神值
  dark-sanity-drain: 0.5

# 死亡掉落系统配置
death-drop:
  # 默认掉率 (0-100)
  default-chance: 60
  # 权限掉率修正（百分比加减）
  permission-modifiers:
    group.vip: -10
  # 掉落盔甲架存活时间（秒）
  timeout-seconds: 1200
  # 掉落 UI 标题
  drop-title: "死亡掉落"

# 处罚系统配置
punishment:
  # 累计警告达到上限时自动封禁 (0=禁用)
  max-warn-before-ban: 5
  # 各权限组最大可处罚时长 (毫秒, -1=无限制)
  duration-limits:
    default: 2592000000        # 30天
    chotentech.punish.vip: 7776000000  # 90天
    chotentech.punish.admin: -1  # 无限制
  # 预配置禁言理由及对应时长
  mute-reasons:
    - reason: "刷屏/恶意灌水"
      duration: "10m"
    - reason: "辱骂/人身攻击"
      duration: "1h"
    - reason: "发布不当内容"
      duration: "3d"
    - reason: "广告/宣传"
      duration: "7d"

# 玩家档案（Profile）系统配置
profile:
  # 每个玩家默认最大玩家档案数量（可通过权限 chotentech.profile.<数量> 扩展）
  max-profiles: 3

# 音乐文件目录（插件启动时读取此目录下ogg文件解析时长，不存在则使用music-durations.yml）
options:
  music-dir: "D:\\Server\\Ets\\plugins\\CraftEngine\\resources\\kangelmain\\resourcepack\\assets\\kangel\\sounds\\music"
  level:
    # 替换原版等级 null为不替换
    override-vanilla: main

# 伤害类型系统配置（详细参数见 attribute-config.yml）
damage-system:
  enabled: false
  # 开启后强制将玩家原版盔甲和盔甲韧性设为0（避免双层减免）
  remove-vanilla-armor: true

# 受击特效配置
hit-effects:
  enabled: true
  # 音效音量
  sound-volume: 1.0
  # 音效音调
  sound-pitch: 1.0
  # 粒子数量
  particle-count: 20
  # 粒子扩散范围
  particle-offset: 0.5
  # 粒子速度
  particle-speed: 0.05

# 倒地/流血机制配置
bleedout:
  # 是否启用倒地机制
  enabled: true
  # 倒地后最大存活时间（秒）
  duration: 60
  # 救援所需时间（秒）
  revival-time: 5
  # 被救起后的生命值比例 (0.0-1.0)
  revive-health: 0.2
  # 倒地期间再次受伤是否加速流血
  damage-accelerates-bleedout: true
  # 每次受伤额外扣除的倒地时间（秒）
  damage-penalty: 10
  # 爬行速度惩罚 (0.0=完全不能动, 1.0=正常速度)
  crawl-speed-penalty: 0.7
  # 爬行半径（方块），超出后拉回倒地位置
  crawl-radius: 3.0

# 组队系统配置
team:
  # 默认队伍上限（无权限玩家）
  default-size: 4
  # 权限节点对应的队伍上限（从大到小排列，取最高权限）
  permission-sizes:
    chotentech.team.size.10: 10
    chotentech.team.size.8: 8
    chotentech.team.size.6: 6

# 好友系统配置
friend:
  # 默认好友上限（无权限玩家）
  max-friends: 50
  # 权限节点 chotentech.friend.<数量> 可提升好友上限
  # 例如 chotentech.friend.100 拥有 100 好友上限

# 变化提示箭头配置（%chotentech_change_*% 占位符与 formatdata 显示追加的箭头）
change-arrows:
  # 上升箭头（大号）
  up: "▲"
  # 下降箭头（大号）
  down: "▼"
  # 上升箭头颜色（MiniMessage 颜色格式）
  up-color: "<#88ff88>"
  # 下降箭头颜色（MiniMessage 颜色格式）
  down-color: "<#ff8888>"

# 靠近 MythicMobs 实体降低精神配置
mm-sanity-drain:
  # 是否启用
  enabled: true
  # 检测间隔（tick，20tick = 1秒）
  interval: 20
  # 检测范围（格）
  range: 8.0
  # 默认精神降低值（未在 mobs 中单独配置的实体使用此值）
  default-amount: 3.0
  # 各实体 ID 对应的精神降低值（覆盖默认值）
  mobs:
    Skeletal: 5.0
    DeathClaw: 10.0
    Hound: 2.0
# ==================== 背包系统（ChoTenBackpack 合并） ====================
backpack:
  # ItemTag 键名：手持物品的 NBT 中包含此标签即为背包物品
  tag: "cho-backpack"

  # 物品被拒绝放入时的提示消息 (MiniMessage 格式)
  deny-slot-message: "<red>该物品不能放入此背包！"

  # 背包类型定义
  types:
    default:
      display: "&6普通背包"
      slots: 27
      # JS 条件：放入物品时判断，返回 true 允许
      # 可用变量: item (ItemStack), player (Player)
      condition: "true"
    # Example: VIP backpack with filter
    # vip:
    #   display: "&bVIP背包"
    #   slots: 54
    #   condition: >-
    #     (function(){
    #       var t = item.getType().name();
    #       return !t.contains("BEDROCK") && !t.contains("BARRIER");
    #     })()
