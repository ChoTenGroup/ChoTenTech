# do not use underline in registry name, this may have issues when using placeholders.
main:
  display:
    raw: "Main" # for command outputs
    default: "<#EFDF8F>Main</#EFDF8F>" # %quetiapine_levelname%
    legacy: "&aMain" # %quetiapine_levelname_legacy%
    # ...
  level:
    # min level
    min: 0
    # start level
    start: 0
    # null for unlimited
    max: 1000
    # Dynamic max level
    # max: '{{ if perm "group.svip" then 1000 else if perm "group.vip" then 500 else 100 }}'
    display:
      0:
        default: "<#F2F5FA>Level <#EFDF8F>%level%"
      20:
        default: "<#EFDF8F>Level <#EFDF8F>%level%"
      40:
        default: "<#E08A98>Level <#EFDF8F>%level%"
    exp:
      0:
        type: calculator
        value: "%level% * 5 + 100"
  gui:
    material: "NETHER_STAR"
  agents:
    onUpgrade:
      js: |
        player.addPotionEffect(new org.bukkit.potion.PotionEffect(org.bukkit.potion.PotionEffectType.SLOWNESS, 300, 1))
        PlayerUtil.showTitle(player, mmUtil.deserialize("<gradient:#EFDF8F:#DFBD7C>[ LEVEL UP ]"), mmUtil.deserialize("<#A9B4C3>" + event.sourceLevel + " -> " + event.targetLevel), 20, 100, 20);