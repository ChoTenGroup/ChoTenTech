# AR-556 枪族示例：全自动步枪 + 两种弹匣 + 三种 5.56 弹药 + 五种配件
# 覆盖点：auto 全自动、addonSlots 五槽、消音器 suppressor、瞄准 zoom、热成像 thermal、配件属性加减法

ar_556_rifle:
  itemdef:
    name: "AR-556 突击步枪"
    desc: |-
      5.56 口径全自动步枪。
      左键开火，右键瞄准，Q 换弹，SHIFT+Q 快速换弹，F 打开菜单，SHIFT+F 切换开火模式。
    material: IRON_HOE
    unbreakable: true
    stack: 1
  model:
    general: "kangelweapon:ar_556"
    aiming: "kangelweapon:ar_556_aim"
    shoot: "kangelweapon:ar_556_fire"
    reload: "kangelweapon:ar_556_reload"
    bolt: "kangelweapon:ar_556_reload"
    jammed: "kangelweapon:ar_556_jammed"
    blocked: "kangelweapon:ar_556_lower"
  gun:
    caliber: 5.56
    auto: true
    category: rifle
    gunType: AR556
    addonSlots: [MUZZLE, SIGHT, GRIP, STOCK, MAGWELL]
    usage:
      reload: 2.6
      reloadFast: 1.8
      removeMag: 0.9
      bolt: 1.0
      inspectChamber: 1.5
      inspectMag: 3.5
      insertAmmo: 0.9
      removeAmmo: 0.6
      fix: 4
      fireMode: 0.2
      draw: 0.8
      zoom: 2.5
    attributes:
      machineEfficiency: 82
      accuracy: 82
      bulletSpeed: 60
      fireRate: 600
      barrelLength: 2.6
      range: 64
      recoilV: 9
      recoilH: 7
      durability: 2500
    recoil:
      1: 1
      4: 2.2
      8: 3.0
      15: 2.4
      30: 1.6
    shake:
      0: 0
      3: 0.8
      6: -1.4
      12: 1.8
      20: -0.6
      30: 0

mag_ar_556_30:
  itemdef:
    name: "AR 5.56 30 发标准弹匣"
    desc: "标准 30 发弹匣，支持快速换弹。"
    material: PAPER
  model:
    general: "kangelweapon:mag_ar_30"
  mag:
    caliber: 5.56
    capacity: 30
    machineEfficiency: 0
    loadingSpeed: 0
    ammoInspectionAccuracy: 0
    ammoInspectionTime: 2
    allowFastReload: 1

mag_ar_556_60:
  itemdef:
    name: "AR 5.56 60 发扩容弹匣"
    desc: "扩容弹匣：更重、换弹更慢，检视时可读出精确余弹。"
    material: PAPER
  model:
    general: "kangelweapon:mag_ar_60"
  mag:
    caliber: 5.56
    capacity: 60
    machineEfficiency: -6
    loadingSpeed: -2
    ammoInspectionAccuracy: 1
    ammoInspectionTime: 3
    allowFastReload: 0

