# 栓动狙击枪 + 猎弩示例
# 狙击：低射速、高弹速、远射程；弩：category: crossbow，走与枪完全相同的弹匣/弹道体系

sr_762_bolt:
  itemdef:
    name: "SR-7.62 栓动狙击枪"
    desc: "栓动单发，高穿深、远射程。"
    material: IRON_HOE
    unbreakable: true
    stack: 1
  model:
    general: "kangelweapon:sr_762"
    aiming: "kangelweapon:sr_762_aim"
    shoot: "kangelweapon:sr_762_fire"
    reload: "kangelweapon:sr_762_reload"
    bolt: "kangelweapon:sr_762_bolt"
    jammed: "kangelweapon:sr_762_jammed"
    blocked: "kangelweapon:sr_762_lower"
  gun:
    caliber: 7.62
    auto: false
    category: sniper
    gunType: SR762
    addonSlots: [MUZZLE, SIGHT, STOCK]
    usage:
      reload: 3.4
      reloadFast: 2.6
      removeMag: 1.0
      bolt: 1.4
      inspectChamber: 1.6
      inspectMag: 3.5
      insertAmmo: 1.1
      removeAmmo: 0.7
      fix: 5
      fireMode: 0.2
      draw: 1.1
      zoom: 4.0
    attributes:
      machineEfficiency: 66
      accuracy: 94
      bulletSpeed: 90
      fireRate: 40
      barrelLength: 4.2
      range: 128
      recoilV: 26
      recoilH: 4
      durability: 2200
    recoil:
      1: 1
      2: 0.8
      5: 0.6
    shake:
      0: 0
      2: 0.4
      5: 0

