# region: WorldGuard 区域ID，玩家进入此区域时将自动解锁图鉴

bases:
  ALP:
    name: "Alpha 基地"
    faction: MEG
    model: "meg_alpha"
    enable: true
    dev: "<#22ebff>十年不晚"
