锅炉房侧门:
  name: 锅炉房侧门

  agent:
    onAlready: 
      - tell color "&6这个电源已经启动了。"
    onPrepare: 
      - title color "&e&l!" subtitle color "&c&l电源已激活"
      - command papi inline "broadcast <white>全旅馆锅炉房侧门维修通道将在不久后开始供电。请维修人员尽快前往，以免错过开门时间。" as console
    onStart: 
      - command papi inline "broadcast <white>锅炉房维修通道已开启。" as console
    onClose: 
      - command papi inline "broadcast <white>维修通道<yellow>{{ &powername }}</yellow>电源的供电程序正在停止。" as console
    onCloseEnd: 
      - command papi inline "broadcast <white>维修通道<yellow>{{ &powername }}</yellow>电源的供电程序已正常关闭。" as console

  leverPos:
    world: "Area3"
    x: 50044
    y: 140
    z: 205

  openDelaySeconds: 10
  activeDurationSeconds: 100

  openingAnimation:
    enabled: true
    particle: END_ROD
    particleCount: 20
    sound: BLOCK_LEVER_CLICK
    volume: 1.0
    pitch: 1.0
    durationTicks: 20
    intervalTicks: 2

  closingAnimation:
    enabled: true
    particle: SMOKE_NORMAL
    particleCount: 15

  obstacles:
    gate1:
      id: "gate1"
      mode: RESTORE_BLOCKS

#      blocks:
#        0:
#          world: "world"
#          x: 101
#          y: 64
#          z: 200
#        1:
#          world: "world"
#          x: 102
#          y: 64
#          z: 200
      cuboid:
        pos1:
          world: "Area3"
          x: 50203
          y: 109
          z: 175
        pos2:
          world: "Area3"
          x: 50203
          y: 106
          z: 173

      sequentialConfig:
        enabled: true
        openDirection: LEFT_TO_RIGHT
        reverseOnClose: true
        blocksPerStep: 1
        stepDelayTicks: 2

        openEffect:
          enabled: true
          particle: CAMPFIRE_COSY_SMOKE
          count: 8

        closeEffect:
          enabled: true
          particle: WHITE_SMOKE
          count: 6