adrenaline_injector:
  id: "adrenaline_injector"
  instant: true
  effects:
    - effect: sound
      sound: ENTITY_PLAYER_LEVELUP
      volume: 0.4
      pitch: 1.8
    - effect: status_effect
      status_effect: pain_relief
      level: 1
      duration: 60
    - effect: modifier
      modifier: health_regen
      amount: 1
      uuid: adrenaline_injector
      expire: 20s
      death_mark: true
    - effect: modifier
      modifier: stamina_regen
      amount: 1
      uuid: adrenaline_injector
      expire: 60s
      death_mark: true
    - effect: modifier
      modifier: attack_damage
      amount: 10
      uuid: adrenaline_injector
      expire: 60s
      death_mark: true
    - effect: modifier
      modifier: weight_limit
      amount: 0.1
      uuid: adrenaline_injector
      expire: 120s
      death_mark: true
    - effect: tick_task
      delay: 1200
      period: 20
      repeats: 60
      effects:
        - effect: hunger
          mode: add
          value: -0.5

