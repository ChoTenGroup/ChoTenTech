# ============================================================================
# 商店默认配置
# 各商店文件只需覆盖需要不同的部分即可
# {id} 会被替换为商店的实际ID
# ============================================================================

gui:
  buy: |-
    MMM---<>O
    IIIIIIIII
    IIIIIIIII
    IIIIIIIII
    IIIIIIIII
    N-----CCC
  sell: |-
    MMM---<>O
    IIIIIIIII
    IIIIIIIII
    IIIIIIIII
    IIIIIIIII
    N-----CCC

gui-item:
  mode-buy:
    material: "BOOK"
    name: "<#F2F5FA><b>购买模式"
    lore: "当前为购买模式\n点击切换到出售模式"
  mode-sell:
    material: "BOOK"
    name: "<#F2F5FA><b>出售模式"
    lore: "当前为出售模式\n点击切换到购买模式"
  previous:
    have:
      name: "<#F2F5FA><b>上一页"
      lore: "点击切换到上一页。\n第 %page% / %total_pages% 页"
    not:
      name: "<#F2F5FA><b>第 1 / 1 页"
      lore: "已是第一页。"
  next:
    have:
      name: "<#F2F5FA><b>下一页"
      lore: "点击切换到下一页。\n第 %page% / %total_pages% 页"
    not:
      name: "<#F2F5FA><b>第 1 / 1 页"
      lore: "已是最后一页。"
  knowledge:
    material: "KNOWLEDGE_BOOK"
    name: "<#DFBD7C><b>信息"
    lore: |-
      点击查看您的货币信息。
  confirm-buy:
    have:
      material: "GREEN_CONCRETE"
      name: "<#8FD4A6><b>确认购买"
      lore: "点击确认购买。"
    not-enough:
      material: "RED_CONCRETE"
      name: "<#E08A98><b>货币不足"
      lore: "您的货币不足以购买所选物品。"
    not:
      material: "GRAY_CONCRETE"
      name: "<#A9B4C3><b>确认购买"
      lore: "您还没有选定任何物品。"
  confirm-sell:
    have:
      material: "GREEN_CONCRETE"
      name: "<#8FD4A6><b>确认出售"
      lore: "点击确认出售。"
    not:
      material: "GRAY_CONCRETE"
      name: "<#A9B4C3><b>确认出售"
      lore: "您还没有选定任何物品。"

# 默认商人等级配置（1-5 级，仅玩家等级 + 出售额，不含好感度）
# 各商店在自身文件内定义专属等级以覆盖此默认值
level:
  1:
    - type: level
      level: main
      value: 5
    - type: quota
      balance: money
      value: 200
  2:
    - type: level
      level: main
      value: 8
    - type: quota
      balance: money
      value: 1000
  3:
    - type: level
      level: main
      value: 12
    - type: quota
      balance: money
      value: 5000
  4:
    - type: level
      level: main
      value: 16
    - type: quota
      balance: money
      value: 10000
  5:
    - type: level
      level: main
      value: 20
    - type: quota
      balance: money
      value: 40000
