      buy: money:80
      sell: money:20
    painkiller_pills:
      id: sertraline:painkiller_pills
      name: "<white>止痛药"
      buy: money:120
      sell: money:35
    # Lv.2 - 进阶医疗
    sterile_bandage:
      id: sertraline:sterile_bandage
      name: "<white>消毒绷带"
      buy-requirements:
        - mode: level
          level: 2
          display: 需要商人等级 Lv.2
      buy: money:200
      sell: money:60
    antibiotic:
      id: sertraline:antibiotic
