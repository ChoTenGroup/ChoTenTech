          display: 需要商人等级 Lv.2
      buy: money:120
      sell: money:35
    french_fries:
      id: sertraline:french_fries
      name: "<white>薯条"
      buy-requirements:
        - mode: level
          level: 2
          display: 需要商人等级 Lv.2
      buy: money:100
      sell: money:30
    pie:
      id: sertraline:pie
      name: "<white>派"
      buy-requirements:
        - mode: level
          level: 2
          display: 需要商人等级 Lv.2
      buy: money:150
