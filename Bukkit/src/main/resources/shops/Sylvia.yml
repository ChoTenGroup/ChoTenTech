Sylvia:
  name: "<aqua>西尔维娅"
  gui:
    buy: |-
      MMM---<>O
      IIIIIIIII
      IIIIIIIII
      IIIIIIIII
      IIIIIIIII
      N-----CCC
    sell: |-
      MMM---<>O
      IIIIIIIII
      IIIIIIIII
      IIIIIIIII
      IIIIIIIII
      N-----CCC
  gui-item:
    mode-buy:
      material: "BOOK"
      name: "<white><b>购买模式"
      lore: "当前为购买模式\n点击切换到出售模式"
    mode-sell:
      material: "BOOK"
      name: "<white><b>出售模式"
      lore: "当前为出售模式\n点击切换到购买模式"
    previous:
      have:
        name: "<white><b>上一页"
        lore: "点击切换到上一页。\n第 %page% / %total_pages% 页"
      not:
        name: "<white><b>第 1 / 1 页"
        lore: "已是第一页。"
    next:
      have:
        name: "<white><b>下一页"
        lore: "点击切换到下一页。\n第 %page% / %total_pages% 页"
      not:
        name: "<white><b>第 1 / 1 页"
        lore: "已是最后一页。"
    knowledge:
      material: "KNOWLEDGE_BOOK"
      name: "<gold><b>信息"
      lore: |-
        点击查看您的货币信息。
    confirm-buy:
      have:
        material: "GREEN_CONCRETE"
        name: "<green><b>确认购买"
        lore: "点击确认购买。"
      not-enough:
        material: "RED_CONCRETE"
        name: "<red><b>货币不足"
        lore: "您的货币不足以购买所选物品。"
      not:
        material: "GRAY_CONCRETE"
        name: "<gray><b>确认购买"
        lore: "您还没有选定任何物品。"
    confirm-sell:
      have:
        material: "GREEN_CONCRETE"
        name: "<green><b>确认出售"
        lore: "点击确认出售。"
      not:
        material: "GRAY_CONCRETE"
        name: "<gray><b>确认出售"
        lore: "您还没有选定任何物品。"
  level:
    1:
      - type: level
        level: main
        value: 5
      - type: affection
        affection: Sylvia
        value: 5
    2:
      - type: level
        level: main
        value: 15
      - type: affection
        affection: Sylvia
        value: 10
      - type: quota
        balance: money
        value: 5000
    3:
      - type: level
        level: main
        value: 25
      - type: affection
        affection: Sylvia
        value: 15
      - type: quota
        balance: money
        value: 20000
  items:
    # Lv.1 - 基础材料
    paper:
      id: sertraline:paper
      buy: money:20
      sell: money:5
    tape:
      id: sertraline:tape
      buy: money:30
      sell: money:8
    wood:
      id: sertraline:wood
      name: "<white>木材"
      buy: money:25
      sell: money:6
    # Lv.2 - 中级通信零件
    copper_wire:
      id: sertraline:copper_wire
      buy-requirements:
        - mode: level
          level: 2
          display: 需要商人等级 Lv.2
      buy: money:150
      sell: money:45
    silver_wire:
      id: sertraline:silver_wire
      buy-requirements:
        - mode: level
          level: 2
          display: 需要商人等级 Lv.2
      buy: money:250
      sell: money:75
    battery:
      id: sertraline:battery
      buy-requirements:
        - mode: level
          level: 2
          display: 需要商人等级 Lv.2
      buy: money:150
      sell: money:45
    radio:
      id: sertraline:radio
      name: "<white>无线电"
      buy-requirements:
        - mode: level
          level: 2
          display: 需要商人等级 Lv.2
      buy: money:350
      sell: money:100
      limit:
        player: 5
        player-reset: 24h
    # Lv.3 - 高级通信设备
    capacitor:
      id: sertraline:capacitor
      buy-requirements:
        - mode: level
          level: 3
          display: 需要商人等级 Lv.3
      buy: money:200
      sell: money:60
    power_supply:
      id: sertraline:power_supply
      buy-requirements:
        - mode: level
          level: 3
          display: 需要商人等级 Lv.3
      buy: money:400
      sell: money:120
    cpu:
      id: sertraline:cpu
      name: "<white>CPU"
      buy-requirements:
        - mode: level
          level: 3
          display: 需要商人等级 Lv.3
      buy: money:500
      sell: money:150
      limit:
        player: 3
        player-reset: 24h
    advanced_wifi_sender:
      id: sertraline:advanced_wifi_sender
      name: "<white>高级信号发射器"
      buy-requirements:
        - mode: level
          level: 3
          display: 需要商人等级 Lv.3
      buy: money:2000
      sell: money:600
      limit:
        player: 1
        player-reset: 24h
