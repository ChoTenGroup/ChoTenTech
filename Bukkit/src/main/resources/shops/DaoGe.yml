      name: "<white>饼干"
      buy: money:50
      sell: money:12
    bandage:
      id: sertraline:bandage
      name: "<white>绷带"
      buy: money:80
      sell: money:20
    # Lv.2 - 中级物资
    iron_sword:
      id: sertraline:iron_sword
      name: "<white>铁剑"
      buy-requirements:
        - mode: level
