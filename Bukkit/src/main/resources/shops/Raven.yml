          display: 需要商人等级 Lv.2
      buy: money:100
      sell: money:30
    paper:
      id: sertraline:paper
      name: "<white>纸张"
      buy-requirements:
        - mode: level
          level: 2
          display: 需要商人等级 Lv.2
      buy: money:20
      sell: money:5
    # Lv.3 - 高级消耗品
    mre:
      id: sertraline:mre
      name: "<white>MRE口粮"
      buy-requirements:
        - mode: level
          level: 3
          display: 需要商人等级 Lv.3
      buy: money:300
