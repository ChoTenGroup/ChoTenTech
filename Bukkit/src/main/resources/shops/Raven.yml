    bandage:
      id: sertraline:bandage
      name: "<white>绷带"
      buy: money:80
      sell: money:20
    bread:
      id: sertraline:bread
      name: "<white>面包"
      buy: money:50
      sell: money:12
    wood:
      id: sertraline:wood
      name: "<white>木材"
      buy: money:25
      sell: money:6
    # Lv.2 - 中级消耗品
    painkiller_pills:
      id: sertraline:painkiller_pills
      name: "<white>止痛药"
      buy-requirements:
        - mode: level
          level: 2
          display: 需要商人等级 Lv.2
      buy: money:120
      sell: money:35
    almond_water_gray:
      id: sertraline:almond_water_gray
