      name: "<white>铁锭"
      buy: money:150
      sell: money:45
    wood:
      id: sertraline:wood
      name: "<white>木头"
      buy: money:25
      sell: money:6
    # Lv.2 - 中级零件
    copper_wire:
      id: sertraline:copper_wire
