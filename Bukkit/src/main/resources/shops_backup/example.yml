# ============================================================================
# 商店配置示例大全
# 本文件展示了所有可用的配置选项，供参考使用
# GUI 部分由 shop-defaults.yml 统一提供，商店文件无需重复编写
# ============================================================================
ExampleShop:
  name: "<gold>示例商店"

  # ─────────────────────────────────────────────
  # 商品列表
  # ─────────────────────────────────────────────
  items:

    # =============================================
    # 基础商品：仅货币购买 + 出售
    # =============================================
    basic_item:
      id: sertraline:some_item
      buy: money:100            # 购买价：100货币
      sell: money:30            # 出售价：30货币

    # =============================================
    # 仅购买（无出售价格）
    # =============================================
    buy_only:
      id: sertraline:buy_only_item
      buy: money:500

    # =============================================
    # 仅出售（玩家卖给商店）
    # =============================================
    sell_only:
      id: sertraline:sell_only_item
      sell: money:50

    # =============================================
    # 物品交换（以物易物）
    # =============================================
    barter_item:
      id: sertraline:refined_wood
      buy:
        - item: "sertraline:wood"
          amount: 5              # 用5个木头换1个
      sell:
        - item: "sertraline:wood"
          amount: 2              # 出售得2个木头

    # =============================================
    # 多货币购买 + 混合支付
    # =============================================
    multi_currency:
      id: sertraline:premium_item
      buy:
        - currency: money
          amount: 200
        - currency: point
          amount: 50             # 同时需要200金钱+50点券
      sell:
        - currency: money
          amount: 100

    # =============================================
    # 动态定价（根据售出数量浮动价格）
    # =============================================
    dynamic_price:
      id: sertraline:energy_drink
      buy:
        - currency: money
          amount: 200
          dynamic-pricing:
            max: 300              # 初始最高价
            min: 100              # 最低价
            stock: 100            # 总库存（越多越便宜）
      sell: money:50
      limit:
        global: 100               # 全服限购100个
        player: 10                # 每人限购10个
        global-reset: 24h         # 全服限购24小时重置
        player-reset: 1h          # 个人限购1小时重置

    # =============================================
    # PAPI 条件要求
    # 支持 >=, <=, >, <, ==
    # =============================================
    papi_required:
      id: sertraline:level_item
      requirements:
        - mode: papi
          papi: "%player_level%"
          value: ">=10"
          display: 玩家等级>=10
      buy: money:1000

    # =============================================
    # 商人等级要求
    # =============================================
    level_required:
      id: sertraline:advanced_item
      buy-requirements:
        - mode: level
          level: 2
          display: 需要商人等级 Lv.2
      buy: money:800
      sell: money:200

    # =============================================
    # 任务要求（需完成指定 Chemdah 任务）
    # =============================================
    quest_required:
      id: sertraline:quest_reward
      requirements:
        - mode: quest
          value: example_quest_id
          display: 需要完成任务「示例任务」
      buy: money:1000
    # shopitem unlock ExampleShop unlock_item
    # =============================================
    unlock_item:
      id: sertraline:secret_item
      buy-requirements:
        - mode: unlock
          value: ExampleShop:unlock_item
          display: 需要先解锁此商品
      buy: money:5000

    # =============================================
    # 多种要求组合
    # =============================================
    multi_requirement:
      id: sertraline:rare_item
      requirements:
        - mode: level
          level: 3
          display: 需要商人等级 Lv.3
        - mode: papi
          papi: "%player_level%"
          value: ">=20"
          display: 玩家等级>=20
      buy:
        - currency: money
          amount: 5000
        - currency: point
          amount: 200
      limit:
        player: 1
        player-reset: 24h

    # =============================================
    # 买/卖分别设置不同要求
    # =============================================
    diff_reqs:
      id: sertraline:restricted_item
      buy-requirements:
        - mode: level
          level: 2
          display: 需要商人等级 Lv.2
      sell-requirements:
        - mode: unlock
          value: ExampleShop:diff_reqs
          display: 需要先解锁出售权限
      buy: money:2000
      sell: money:500

    # =============================================
    # 原始 unlock 字段（物品直接隐藏直到解锁）
    # 和 requirements 的 unlock 模式不同，此方式
    # 没解锁时商品完全不显示
    # =============================================
    hidden_until_unlock:
      id: sertraline:unlockable_item
      unlock: ExampleShop:hidden_until_unlock
      buy: money:10000

    # =============================================
    # 礼包商品
    # =============================================
    gift_pack:
      id: sertraline:diamond            # 展示用的物品ID
      name: "<gold>超值礼包"
      type: giftpack
      gift-pack: example_gift           # 对应 gift-packs.yml 中的礼包ID
      buy:
        - currency: point
          amount: 149
