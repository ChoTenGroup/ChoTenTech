# 组队聊天频道
key: partychat
display-name: "<#A9B4C3>[<#CDAEEF>队伍</#CDAEEF>]</#A9B4C3>"
formats:
  default: "<#A9B4C3>[<#CDAEEF>队伍<#A9B4C3>-<#F2F5FA><team_name></#F2F5FA>]</#A9B4C3> <username><#A9B4C3>: </#A9B4C3><message>"
  console: "[队伍] <username>: <message>"
quick-prefix: ".pc"
radius: -1
cooldown: 1
cooldown-overrides:
  chotentech.chat.cooldown.admin: -1
# 组队频道：收件人 = 队伍成员（复用 /team 组队系统）
party: true
permission: ""
