sanity_salt:
  xbuilder:
    name: "<!i><#FF55FF>锂盐<reset> (${var:durabilityAsIn}$/${var:maxdurability}$)"
    material: BEETROOT
    item-model: "kangelitem:sanity_salt"
  sertraline:
    tier: B
    type: food
    lore-format: default
    actions:
      onConsume:
        - async: false
          js: |
    vals:
      lore: |
        锂盐可用于精神方面医疗，也可用于治疗兴奋冲动、攻击行为。
        只在紧急情况下使用，严禁滥用药物。
        立即恢复12精神，精神恢复+0.2/s，药效持续40秒。
        精神恢复效果不叠加。
      graylore: |
        我闭上眼睛就可以养神....
    vars:
      maxdurability: 5
      durability: 5
