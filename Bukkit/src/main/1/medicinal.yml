almond_bandage:
  xbuilder:
    name: "<!i><#AAAAAA>杏仁绷带<reset> (${var:durabilityAsIn}$/${var:maxdurability}$)"
    material: BEETROOT
    item-model: "kangelitem:almond_bandage"
  sertraline:
    tier: C
    type: food
    lore-format: default
    vals:
      lore: |
        浸润杏仁水的绷带，相比未经处理的绷带疗效更佳。
      graylore: |
        如果实在没吃的也可以试试吃这个?
        好吧，别想了，吃不了的。

        <!i><gray>治疗10%血量，20%外伤，5%内伤。
        <!i><gray>最高治疗至最大外伤的95%，最大内伤的80%。
    vars:
      maxdurability: 1
      durability: 1
sterile_bandage:
  xbuilder:
    name: "<!i><#AAAAAA>军用消毒绷带<reset> (${var:durabilityAsIn}$/${var:maxdurability}$)"
    material: BEETROOT
    item-model: "kangelitem:bandage"
  sertraline:
    tier: B
    type: food
    lore-format: default
    vals:
      lore: |
        军用的纱布绷带，经过了高温灭菌处理。
        用于治疗较弱的伤势。
        可使用三次。

        <!i><gray>治疗15%外伤。
        <!i><gray>最高治疗至最大外伤的85%。
      graylore: |
        味道很好闻。
    vars:
      maxdurability: 3
      durability: 3
