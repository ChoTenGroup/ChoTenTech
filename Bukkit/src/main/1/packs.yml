  xbuilder:
    name: "<!i><red>“天龙”医疗袋<reset> (${var:durabilityAsIn}$/${var:maxdurability}$)"
    material: PAPER
    item-model: "kangelitem:tianlong_medkit"
  sertraline:
    tier: B
    lore-format: default
    vals:
      lore: |
        天龙二十四军急救袋是最大化的延续系列，提供相对更好的医疗保障。
        允许你治疗常规伤害以及少量外伤。由于它本身不专对外伤，将会消耗更多耐久。
        然而，完成它应尽的使命后，会面对着更严重的伤害手足无措。

        <!i><red>无法治疗内伤伤势。
        <!i>单次治疗 <dark_green>血量</dark_green> <yellow>56</yellow> | <dark_aqua>外伤</dark_aqua> <red>20</red>
