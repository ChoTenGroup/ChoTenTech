ice_medkit:
  xbuilder:
    name: “<!i><red>”冰块”医疗盒<reset> (${var:durabilityAsIn}$/${var:maxdurability}$)”
    material: PAPER
    item-model: “kangelitem:ice_medkit”
  sertraline:
    tier: C
    lore-format: default
    vals:
      lore: |
        “冰块”医疗盒是冰块委员会研发的临时医疗物品。
        虽然它对内外伤无能为力，但是胜在便宜和普及。
        一个在被抛弃路上而设计的物品。提供最最基础的保障。
        很快的使用、很快的恢复、很快的抛弃。亦如当初的命运。

        <!i><red>无法治疗内伤、外伤伤势。
        <!i>单次治疗 <dark_green>血量</dark_green> <red>30</red>
        <!i>治疗速度 <dark_green>血量</dark_green> <yellow>10</yellow>
        <!i>耐久消耗 <dark_green>血量</dark_green> <green>1.0x</green>
        <!i>启用 <green>1秒</green> - 使用 <yellow>1秒</yellow> - 收起 <green>1秒</green>
        <!i>消耗食物 <red>4</red>
    vars:
      maxdurability: 50
      durability: 50
