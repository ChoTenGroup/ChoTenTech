# 投掷物物品配置 — 投掷物配置文件位于 projectiles/throwables.yml
# 对应的 Sertraline 技能效果配置需另行在 sertraline 技能配置中绑定

nizxc_flash:
  xbuilder:
    name: '<!i><#ff6b6b>"Nizxc" 闪光弹'
    material: PAPER
    item-model: "kangelitem:nizxc_flash"
  minecraft:
    max_stack_size: 4
  sertraline:
    tier: A
    lore-format: default
    vals:
      lore: |
        Nizxc 闪光弹采用新型高亮配方。
        瞬间释放强光，让敌人无处遁形。
      graylore: |
        去闪瞎敌人的眼！

        <gray><!i>爆炸延迟: 2.0~3.0秒 <!i>致盲范围: 5 / 12 / 18米
        <gray><!i>致盲时长: 14 / 6 / 3秒 <!i>附带效果: 反胃 10秒

