title: "&F<shift:-16><image:kangelicon:interfere_power><shift:-176><aqua><font:minecraft:fusionpixel10>权力斗争"

layout: [
    "XXX     U"
    "         "
    "AAABBBCCC"
    "AAABBBCCC"
    "A1AB2BC3C"
    "AAABBBCCC"
]

events {
    pre_open = [
        "set reg to profile data power_reg default 100 set con to profile data power_con default 100 set ref to profile data power_ref default 100 set total to math + [ &reg &con &ref ] context set total to &total context set reg to math / [ &reg &total 0.01 ] context set con to math / [ &con &total 0.01 ] context set ref to math / [ &ref &total 0.01 ] context set regpile to type int math / [ context get reg 10 ] context set conpile to type int math / [ context get con 10 ] context set refpile to type int math / [ context get ref 10 ] context set med to $ '[reg, con, ref].sort(function(a, b){return b-a})[1]'"
    ]
}

items {
    X {
        material: structure void
        model: 10000
        name: "返回"
        action: [
            menu open interferes
            sound BLOCK_NOTE_BLOCK_BIT
        ]
    }
    A {
        material: structure void
        model: 10000
        name: "&4&l改组派势力"
        action: [
            page previous
            icon by '<' refresh
            icon by '>' refresh
            menu title update
        ]
        lore: [
            "&6代表人: &fZERO"
            ""
            "&4改组派&7由当年在与&c U.E.C. &7的战争中"
            "投靠&c U.E.C. &7的前官员组成，"
            "签订和平协议后因此这些人员回到了&6 M.E.G. &7工作。"
            "该派系成员将&c U.E.C. &7在 Level 76 设立的无限下水道政府作为榜样，"
            "坚称与&c U.E.C. &7的真正合作会为&6 M.E.G. &7和流浪者带来最大的繁荣，"
            "——哪怕代价是屈服于他们。"
            "他们会反对任何对&c U.E.C. &7的合作产生阻碍的举动。"
        ]
    }
    B {
        material: structure void
        model: 10000
        name: "&3&l保守派势力"
        action: [
            page previous
            icon by '<' refresh
            icon by '>' refresh
            menu title update
        ]
        lore: [
            "&6代表人: &f毛瑟"
            ""
            "&3保守派&7主要由在&6 M.E.G. &7输掉与"
            "&cU.E.C. &7的战争后的投降的一些成员组成。"
            "这些人的麻烦相对来说轻很多，因为他们古板又腐败，"
            "只要允许他们攫取利益，让金钱源源不断流入他们口袋的话，"
            "也许该派系大概就会满足现状。"
        ]
    }
    C {
        material: structure void
        model: 10000
        name: "&e&l维新派势力"
        action: [
            page previous
            icon by '<' refresh
            icon by '>' refresh
            menu title update
        ]
        lore: [
            "&6代表人: &f波风"
            ""
            "&e维新派&7由监督者的手下直接领导，是一个近期成立的派系。"
            "大体上由充满希望且拥护&6 M.E.G. &7的年轻职员组成，"
            "他们正在力图以革新让&6 M.E.G. &7再次伟大。"
            "维新派基本上对&6 M.E.G. &7表示支持。"
            "然而他们的热情，以及...比较令人担心的..."
            "难掩的公开与&c U.E.C. &7为敌的态度可能会在日后成为大问题。"
        ]
    }
    1 {
        material: structure void
        item_model: "kangelicon:{{ set med to context get med set v to context get reg if check &med == &v then *yellow else if check &v > &med then *green else *red }}_pile_{{ context get regpile }}"
        name: "&4&l改组派&f支持率: &e{{ set regs to context get reg $ 'Math.round(regs*100)/100' }}&7%"
        action: [
            page previous
            icon by '<' refresh
            icon by '>' refresh
            menu title update
        ]
        lore: [
            " "
            "得票数: &e{{ profile data power_reg default ??? }} &7/总票数{{ context get total }}"
        ]
    }
    2 {
        material: structure void
        item_model: "kangelicon:{{ set med to context get med set v to context get con if check &med == &v then *yellow else if check &v > &med then *green else *red }}_pile_{{ context get conpile }}"
        name: "&3&l保守派&f支持率: &e{{ set con to context get con $ 'Math.round(con*100)/100' }}&7%"
        action: [
            page previous
            icon by '<' refresh
            icon by '>' refresh
            menu title update
        ]
        lore: [
            " "
            "得票数: &e{{ profile data power_con default ??? }} &7/总票数{{ context get total }}"
        ]
    }
    3 {
        material: structure void
        item_model: "kangelicon:{{ set med to context get med set v to context get ref if check &med == &v then *yellow else if check &v > &med then *green else *red }}_pile_{{ context get refpile }}"
        name: "&e&l维新派&f支持率: &e{{ set ref to context get ref $ 'Math.round(ref*100)/100' }}&7%"
        action: [
            page previous
            icon by '<' refresh
            icon by '>' refresh
            menu title update
        ]
        lore: [
            " "
            "得票数: &e{{ profile data power_ref default ??? }} &7/总票数{{ context get total }}"
        ]
    }
}


