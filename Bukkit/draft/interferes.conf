title: "&F<shift:-16><image:kangelicon:interferes><shift:-176><aqua><font:minecraft:fusionpixel10>干涉事务"

layout: [
    "XXXAAAA<>"
    "AAAAAAAAA"
    "A       A"
    "A       A"
    "A       A"
    "AAAAAAAAA"
]

events {
    post_open = [
        icon by '<' refresh
        icon by '>' refresh
    ]
}

items {
    > {
        material: lime stained glass pane
        name: "{{ math + [ page current 1 ] }} / {{ math + [ page max 1 ] }}"
        action: [
            page next
            icon by '<' refresh
            icon by '>' refresh
            menu title update
        ]
    }
    < {
        material: cyan stained glass pane
        name: "{{ math + [ page current 1 ] }} / {{ math + [ page max 1 ] }}"
        action: [
            page previous
            icon by '<' refresh
            icon by '>' refresh
            menu title update
        ]
    }
    X {
        material: structure void
        model: 10000
        name: "返回"
        action: [
            menu open literal "menu"
        ]
    }
    A {
        material: air
        name: "-"
    }
}

generator {
    elements = [
        {name: "权力斗争", 
        idef: "interfere_power", 
        idefresult: "result_power", 
        lore: "M.E.G. 内部其实也不是铁板一块，\n目前深陷权力斗争的困境。\n&4改组&7，&3保守&7，&e维新&7三派为了争权夺利大打出手。\n&8我至死也未能见到照耀我祖国的曙光。"},
        {name: "毛瑟兵变", 
        idef: "interfere_army", 
        idefresult: "result_army", 
        lore: "毛瑟因不满 M.E.G. 的制度打算脱离一部分军队。\n&8痛苦面前，没有英雄。"},
        {name: "办公室紧急状态", 
        idef: "interfere_office", 
        idefresult: "result_office", 
        lore: "废弃办公室最近来了一批不速之客，\n&8我们争取解放的道路不得已停下了脚步。"},
        {name: "宜居地带冲突", 
        idef: "interfere_skirmish", 
        idefresult: "result_skirmish", 
        lore: "对于那些盘踞了许久的叛军，\n是时候驱赶他们，还宜居地带一个自由了。\n&8天日昭昭，天日昭昭！"},
        {name: "我不是药神", 
        idef: "interfere_medicinal", 
        idefresult: "result_medicinal", 
        lore: "他们只是想要活着，有什么错?\n&8病是一种罪过，上帝也无法赦免。\n&8穷是一种病态，药神也无法医治。"},
        {name: "奇爱博士", 
        idef: "interfere_stopworrying", 
        idefresult: "result_stopworrying", 
        lore: "这样的装置是不可能起到有效的威慑作用的...\n&8这个世界只是一台手摇风琴，只能由天主亲自弹奏。\n&8而我们所有人都只能跟着风箱拉出的音符起舞。"},
        {name: "贸易集团通商", 
        idef: "interfere_trade", 
        idefresult: "result_trade", 
        lore: "贸易是我们的主要组成部分...\n&8流沙之上，大厦必倾。"}
        {name: "煤炭监狱", 
        idef: "interfere_coal", 
        idefresult: "result_coal", 
        lore: "贸易是我们的主要组成部分...\n&8那乌黑的双手，能否捧起一滩清泉？"}
    ]
    
    output {
        material: book
        item_model: "kangelicon:{{element idef}}_{{profile data element idef default 0}}"
        name: "<white>剧情事务: <yellow>{{element name}}"
        lore: [
            " "
            "{{ element lore }}"
            " "
            "{{ case profile data element idef default 0 [ when 0 -> '&c未解锁' when 1 -> '&e进行中' when 2 -> inline '&a已完成 &7- 结果为 &e{{ profile data element idefresult default '&7未指定' }}' ] }}"
        ]
        action: [
            
            "if check profile data element idef default 0 == 1 then { sound BLOCK_NOTE_BLOCK_BIT by 1 1 menu open element idef } else { sound BLOCK_NOTE_BLOCK_SNARE by 1 1 msg '<red>目前没有进行这个干涉事务!' }"
        ]
    }
    
}